plugins {
    id "com.android.application"
}

android {
    namespace "fi.nyja.ventapp"
    compileSdk 33

    defaultConfig {
        applicationId "fi.nyja.ventapp"
        minSdk 21
        targetSdk 33
        versionCode 6
        versionName "1.6"
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    signingConfigs {
        sideload {
            storeFile file("../signing/ventapp-sideload.keystore")
            storePassword "ventapp-sideload"
            keyAlias "ventapp"
            keyPassword "ventapp-sideload"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.sideload
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    androidResources {
        noCompress += ["onnx", "xlsx"]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.core:core:1.9.0"
    implementation "com.microsoft.onnxruntime:onnxruntime-android:1.19.2"
    testImplementation "junit:junit:4.13.2"
}

tasks.register("stageTemplate", Copy) {
    from("../../templates/matprotokoll_grund.xlsx")
    into("src/main/assets")
}

preBuild.dependsOn "stageTemplate"
