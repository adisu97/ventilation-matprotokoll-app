name: Android test-APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installera Android SDK 33
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          rm -rf "$SDK/cmdline-tools/latest"
          mv /tmp/cmdtools/cmdline-tools "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --install "platforms;android-33" "build-tools;34.0.0"

      - name: Bygg debug-signerad APK
        working-directory: android-test
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Döp om och räkna SHA-256
        run: |
          set -euo pipefail
          cp android-test/app/build/outputs/apk/debug/app-debug.apk nyja-test.apk
          sha256sum nyja-test.apk | tee SHA256SUMS

      - name: Publicera förhandsrelease test-apk-1
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-apk-1
          target_commitish: ${{ github.sha }}
          name: Android test-APK
          draft: false
          prerelease: true
          make_latest: "false"
          overwrite_files: true
          files: |
            nyja-test.apk
            SHA256SUMS
          body: |
            Minimal test-APK (debug-signerad). En knapp, Tryck, visar NYJA.
            https://github.com/adisu97/ventilation-matprotokoll-app/releases/download/test-apk-1/nyja-test.apk
