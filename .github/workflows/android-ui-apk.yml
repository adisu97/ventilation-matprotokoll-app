name: Android UI-APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installera Android SDK 33
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          rm -rf "$SDK/cmdline-tools/latest"
          mv /tmp/cmdtools/cmdline-tools "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --install "platforms;android-33" "build-tools;34.0.0"

      - name: Bygg debug-signerad APK
        working-directory: android-app
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Döp om och räkna SHA-256
        run: |
          set -euo pipefail
          cp android-app/app/build/outputs/apk/debug/app-debug.apk ventapp-ui.apk
          sha256sum ventapp-ui.apk | tee SHA256SUMS

      - name: Publicera förhandsrelease ui-apk-2
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ui-apk-2
          target_commitish: ${{ github.sha }}
          name: Android UI
          draft: false
          prerelease: true
          make_latest: "false"
          overwrite_files: true
          files: |
            ventapp-ui.apk
            SHA256SUMS
          body: |
            Framsida för mätprotokoll (debug-signerad). Avläsning är inte kopplad ännu.
            https://github.com/adisu97/ventilation-matprotokoll-app/releases/download/ui-apk-2/ventapp-ui.apk
