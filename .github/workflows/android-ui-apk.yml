name: Android UI-APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installera Android SDK 33
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          rm -rf "$SDK/cmdline-tools/latest"
          mv /tmp/cmdtools/cmdline-tools "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --install "platforms;android-35" "build-tools;35.0.1"

      - name: Bygg debug-signerad APK
        working-directory: android-app
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Kontrollera att Starta ligger först och att versionCode är 3
        run: |
          set -euo pipefail
          APK="android-app/app/build/outputs/apk/universal/debug/app-universal-debug.apk"
          AAPT="${ANDROID_HOME}/build-tools/35.0.1/aapt"
          badging="$("$AAPT" dump badging "$APK" 2>/dev/null || true)"
          code="$(printf '%s\n' "$badging" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)"
          echo "versionCode=$code"
          test "$code" = "18"
          found=0
          while IFS= read -r layout; do
            tree="$("$AAPT" dump xmltree "$APK" "$layout" 2>/dev/null || true)"
            start_line="$(printf '%s\n' "$tree" | awk '/E: Button/{print NR; exit}')"
            excel_line="$(printf '%s\n' "$tree" | awk '/E: EditText/{print NR; exit}')"
            if [ -z "$start_line" ] || [ -z "$excel_line" ] || [ "$start_line" -ge "$excel_line" ]; then
              continue
            fi
            first="$(printf '%s\n' "$tree" | awk '/^[[:space:]]*E: /{print; exit}')"
            if ! printf '%s\n' "$first" | grep -q 'LinearLayout'; then
              continue
            fi
            echo "$layout first: $first button:$start_line edit:$excel_line"
            found=1
          done < <(unzip -Z1 "$APK" | grep '\.xml$' || true)
          test "$found" = "1"

      - name: Bygget är bara en manuell kontroll
        run: echo "Publicerar inte. app-apk-1 görs av Android app-APK."
