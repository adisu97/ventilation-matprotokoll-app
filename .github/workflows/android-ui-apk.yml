name: Android UI-APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installera Android SDK 33
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          rm -rf "$SDK/cmdline-tools/latest"
          mv /tmp/cmdtools/cmdline-tools "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --install "platforms;android-33" "build-tools;34.0.0"

      - name: Bygg debug-signerad APK
        working-directory: android-app
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Kontrollera att Starta ligger först och att versionCode är 3
        run: |
          set -euo pipefail
          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="${ANDROID_HOME}/build-tools/34.0.0/aapt"
          code="$("$AAPT" dump badging "$APK" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)"
          echo "versionCode=$code"
          test "$code" = "3"
          mapfile -t layouts < <(unzip -Z1 "$APK" | grep 'activity_main.xml$' || true)
          test "${#layouts[@]}" -ge 1
          for layout in "${layouts[@]}"; do
            echo "layout $layout"
            tree="$("$AAPT" dump xmltree "$APK" "$layout")"
            first="$(printf '%s\n' "$tree" | awk '/^[[:space:]]*E: /{print; exit}')"
            echo "first element: $first"
            printf '%s\n' "$first" | grep -q 'LinearLayout'
            start_line="$(printf '%s\n' "$tree" | awk '/E: Button/{print NR; exit}')"
            excel_line="$(printf '%s\n' "$tree" | awk '/E: EditText/{print NR; exit}')"
            echo "button line $start_line excel line $excel_line"
            test -n "$start_line" -a -n "$excel_line"
            test "$start_line" -lt "$excel_line"
          done

      - name: Döp om och räkna SHA-256
        run: |
          set -euo pipefail
          cp android-app/app/build/outputs/apk/debug/app-debug.apk ventapp-ui.apk
          sha256sum ventapp-ui.apk | tee SHA256SUMS

      - name: Publicera förhandsrelease ui-apk-3
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ui-apk-3
          target_commitish: ${{ github.sha }}
          name: Android UI
          draft: false
          prerelease: true
          make_latest: "false"
          overwrite_files: true
          files: |
            ventapp-ui.apk
            SHA256SUMS
          body: |
            Framsida för mätprotokoll (debug-signerad), versionCode 3. Starta sitter fast högst upp.
            https://github.com/adisu97/ventilation-matprotokoll-app/releases/download/ui-apk-3/ventapp-ui.apk
