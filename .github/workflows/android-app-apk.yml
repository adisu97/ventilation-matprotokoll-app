name: Android app-APK

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android-app-apk.yml"
      - "templates/matprotokoll_grund.xlsx"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installera Android SDK 33
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          rm -rf "$SDK/cmdline-tools/latest"
          mv /tmp/cmdtools/cmdline-tools "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --install "platforms;android-33" "build-tools;34.0.0"

      - name: Enhetstester
        working-directory: android-app
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Bygg debug-signerad APK
        working-directory: android-app
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Kontrollera Starta överst och versionCode 4
        run: |
          set -euo pipefail
          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="${ANDROID_HOME}/build-tools/34.0.0/aapt"
          badging="$("$AAPT" dump badging "$APK" 2>/dev/null || true)"
          code="$(printf '%s\n' "$badging" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)"
          echo "versionCode=$code"
          test "$code" = "5"
          mapfile -t layouts < <(unzip -Z1 "$APK" | grep 'activity_main.xml$' || true)
          test "${#layouts[@]}" -ge 1
          for layout in "${layouts[@]}"; do
            tree="$("$AAPT" dump xmltree "$APK" "$layout" 2>/dev/null || true)"
            first="$(printf '%s\n' "$tree" | awk '/^[[:space:]]*E: /{print; exit}')"
            echo "$layout first: $first"
            printf '%s\n' "$first" | grep -q 'LinearLayout'
            start_line="$(printf '%s\n' "$tree" | awk '/E: Button/{print NR; exit}')"
            excel_line="$(printf '%s\n' "$tree" | awk '/E: EditText/{print NR; exit}')"
            test -n "$start_line" -a -n "$excel_line"
            test "$start_line" -lt "$excel_line"
          done

      - name: Döp om, signera om v1+v2, kontrollera och räkna SHA-256
        run: |
          set -euo pipefail
          AAPT="${ANDROID_HOME}/build-tools/34.0.0/aapt"
          APKSIGN="${ANDROID_HOME}/build-tools/34.0.0/apksigner"
          ZIPALIGN="${ANDROID_HOME}/build-tools/34.0.0/zipalign"
          cp android-app/app/build/outputs/apk/debug/app-debug.apk /tmp/unsigned.apk
          zip -d /tmp/unsigned.apk 'META-INF/*' || true
          "$ZIPALIGN" -f 4 /tmp/unsigned.apk /tmp/aligned.apk
          "$APKSIGN" sign \
            --ks android-app/signing/ventapp-sideload.keystore \
            --ks-key-alias ventapp \
            --ks-pass pass:ventapp-sideload \
            --key-pass pass:ventapp-sideload \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out ventapp.apk \
            /tmp/aligned.apk
          echo "zipalign check:"
          "$ZIPALIGN" -c -v 4 ventapp.apk | tail -5
          badging="$("$AAPT" dump badging ventapp.apk 2>/dev/null || true)"
          echo "$badging" | head -5
          printf '%s\n' "$badging" | grep -q "sdkVersion:'21'"
          printf '%s\n' "$badging" | grep -q "targetSdkVersion:'33'"
          unzip -l ventapp.apk | grep -q 'lib/armeabi-v7a/libonnxruntime.so'
          unzip -l ventapp.apk | grep -q 'lib/arm64-v8a/libonnxruntime.so'
          if unzip -l ventapp.apk | grep -q 'lib/x86/'; then
            echo "unexpected x86 native library" >&2
            exit 1
          fi
          "$AAPT" dump xmltree ventapp.apk AndroidManifest.xml 2>/dev/null | grep -q 'extractNativeLibs'
          if "$AAPT" dump xmltree ventapp.apk AndroidManifest.xml 2>/dev/null | grep -q 'testOnly'; then
            echo "testOnly is set" >&2
            exit 1
          fi
          "$APKSIGN" verify --verbose --print-certs ventapp.apk | tee /tmp/apksign.txt
          grep -q "Verified using v1 scheme (JAR signing): true" /tmp/apksign.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/apksign.txt
          grep -q "CN=Ventapp sideload" /tmp/apksign.txt
          sha256sum ventapp.apk | tee SHA256SUMS

      - name: Publicera förhandsrelease app-apk-2
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-apk-2
          target_commitish: ${{ github.sha }}
          name: Mätprotokoll Android
          draft: false
          prerelease: true
          make_latest: "false"
          overwrite_files: true
          files: |
            ventapp.apk
            SHA256SUMS
          body: |
            Mätprotokoll för Android, versionCode 5. Samma sideload-signatur i fortsättningen (v1+v2).
            En avinstallation av tidigare fi.nyja.ventapp kan behövas en gång.
            https://github.com/adisu97/ventilation-matprotokoll-app/releases/download/app-apk-2/ventapp.apk
